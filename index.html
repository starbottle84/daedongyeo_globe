<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대동여퀴즈 지구본</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <style>
    :root {
      --space: #0b1630;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-text: #1d2433;
      --card-sub: #5a6478;
    }
    html, body { margin: 0; height: 100%; background: var(--space); font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    #map { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #17284d 0%, var(--space) 70%); }
    .info {
      position: absolute; top: 16px; left: 16px; z-index: 1;
      padding: 12px 16px; border-radius: 14px;
      background: var(--card-bg); color: var(--card-text);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      max-width: calc(100vw - 32px); box-sizing: border-box;
    }
    .info h1 { margin: 0 0 4px; font-size: 18px; }
    .info p { margin: 0; font-size: 13px; color: var(--card-sub); }
    .info .zoom { margin-top: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info">
    <h1>대동여퀴즈 지구본</h1>
    <p>확대할수록 더 많은 지명이 보여요</p>
    <p class="zoom">확대 단계 <b id="zoom">-</b></p>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="js/globe.js"></script>
</body>
</html>
